[project]
name = "llm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.28.1",
    "openai>=2.48.0",
    "psycopg[binary,pool]>=3.2.13",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.11.0",
    "python-dotenv>=1.2.1",
    "tenacity>=9.1.2",
]

[project.scripts]
llm = "llm:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

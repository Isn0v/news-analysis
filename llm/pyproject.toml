[project]
name = "sentix-llm"
version = "0.1.0"
description = "Sentix: Quantitative financial sentiment analysis and event reasoning"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.28.1",
    "openai>=2.48.0",
    "psycopg[binary,pool]>=3.2.13",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.11.0",
    "python-dotenv>=1.2.1",
    "tenacity>=9.1.2",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"


services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: trader
      POSTGRES_PASSWORD: strongpassword
      POSTGRES_DB: crypto_news
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  go-collector:
    build: ./go-collector
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: trader
      POSTGRES_PASSWORD: strongpassword
      POSTGRES_DB: crypto_news
    depends_on:
      - db
    restart: always


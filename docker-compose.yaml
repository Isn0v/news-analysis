services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: trader
      POSTGRES_PASSWORD: strongpassword
      POSTGRES_DB: crypto_news
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  go-collector:
    build: ./go-collector
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: trader
      POSTGRES_PASSWORD: strongpassword
      POSTGRES_DB: crypto_news
    depends_on:
      - db
    restart: always

  llm:
    build: ./llm
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: trader
      POSTGRES_PASSWORD: strongpassword
      POSTGRES_DB: crypto_news
      LLM_API_KEY: ${LLM_API_KEY:-ollama}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_MODEL: ${LLM_MODEL:-deepseek-r1:14b}
      BATCH_SIZE: ${BATCH_SIZE:-3}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-10}
      MAX_CONCURRENT_REQUESTS: ${MAX_CONCURRENT_REQUESTS:-2}
      MAX_CONTENT_CHARS: ${MAX_CONTENT_CHARS:-6000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - db
    restart: always

volumes:
  pgdata:

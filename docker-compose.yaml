name: sentix

services:
  db:
    image: postgres:15-alpine
    restart: always
    env_file:
      - .env
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  go-collector:
    build: ./go-collector
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
    depends_on:
      - db

  # remote-groq-llm:
  #   build: ./llm
  #   restart: always
  #   env_file:
  #     - .env
  #   environment:
  #     POSTGRES_HOST: db
  #   extra_hosts:
  #     - "host.docker.internal:host-gateway"
  #   depends_on:
  #     - db

  # local-mlx-llm:
  #   build: ./llm
  #   restart: always
  #   env_file:
  #     - llm/.env.mlx.deepseek
  #   environment:
  #     POSTGRES_HOST: db
  #   extra_hosts:
  #     - "host.docker.internal:host-gateway"
  #   depends_on:
  #     - db

  remote-llm:
    build: ./llm
    restart: always
    env_file:
      - llm/.env.proxyapi
    environment:
      POSTGRES_HOST: db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - db

  market-evaluator:
    build: ./market-evaluator
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
    depends_on:
      - db

volumes:
  pgdata:
